<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OnlyFans</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* =========================
           ЭКРАН "КАПЧИ"
        ========================== */

        #captchaScreen {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            z-index: 100;
        }

        .captcha {
            width: 304px;
            height: 78px;

            display: flex;
            align-items: center;

            padding: 12px;

            background: #fafafa;
            border: 1px solid #d5d5d5;
            border-radius: 3px;

            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);

            cursor: pointer;
            user-select: none;
        }

        .checkbox {
            width: 28px;
            height: 28px;

            flex-shrink: 0;

            margin-right: 12px;

            border: 2px solid #555;
            border-radius: 2px;

            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
        }

        .captchaText {
            flex: 1;

            font-size: 14px;
            color: #222;
        }

        .captchaRight {
            width: 55px;

            text-align: center;

            font-size: 9px;
            color: #777;
        }

        .captchaLogo {
            font-size: 24px;
            margin-bottom: 2px;
        }

        /* =========================
           ВИДЕО
        ========================== */

        #videoScreen {
            position: fixed;
            inset: 0;

            display: none;

            background: #000;
        }

        #video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #000;
        }

        /* Анимация галочки */

        .checked {
            border-color: transparent;
            color: #22a447;
        }

        .loading {
            width: 23px;
            height: 23px;

            border: 3px solid #ddd;
            border-top-color: #4285f4;

            border-radius: 50%;

            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Экран проверки -->
    <div id="captchaScreen">

        <div class="captcha" id="captcha">

            <div class="checkbox" id="checkbox"></div>

            <div class="captchaText">
                Я не робот
            </div>

            <div class="captchaRight">
                <div class="captchaLogo">
                    ↻
                </div>

                проверка
            </div>

        </div>

    </div>


    <!-- Видео -->
    <div id="videoScreen">

        <video
            id="video"
            preload="auto"
            playsinline
        >
            <source src="video.mp4" type="video/mp4">
        </video>

    </div>


    <script>
        const captcha = document.getElementById("captcha");
        const checkbox = document.getElementById("checkbox");

        const captchaScreen = document.getElementById("captchaScreen");
        const videoScreen = document.getElementById("videoScreen");

        const video = document.getElementById("video");


        captcha.addEventListener("click", async () => {

            /*
             * ВАЖНО:
             * fullscreen запрашиваем прямо во время клика,
             * пока браузер считает это действием пользователя.
             */

            try {
                await document.documentElement.requestFullscreen();
            } catch (error) {
                console.log("Fullscreen не разрешён:", error);
            }


            /* Показываем короткую загрузку */

            checkbox.innerHTML = '<div class="loading"></div>';


            setTimeout(async () => {

                checkbox.innerHTML = "✓";
                checkbox.classList.add("checked");


                setTimeout(async () => {

                    captchaScreen.style.display = "none";
                    videoScreen.style.display = "block";


                    /*
                     * Видео начинается сначала
                     */

                    video.currentTime = 0;

                    video.muted = false;
                    video.volume = 1;


                    try {

                        await video.play();

                    } catch (error) {

                        console.log("Ошибка запуска видео:", error);

                    }

                }, 200);

            }, 450);

        });
    </script>

</body>
</html>
